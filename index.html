<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOGEI (SMC-PRIVATE) LIMITED</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6f8;
    color: #1c2430;
  }

  main {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border: 1px solid #e3e8ee;
    border-radius: 14px;
    padding: 48px 32px;
    text-align: center;
    box-shadow: 0 2px 16px rgba(28, 36, 48, 0.06);
  }

  h1 {
    font-size: 1.5rem;
    line-height: 1.35;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }

  p {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #5b6775;
    margin-bottom: 32px;
  }

  .btn {
    display: inline-block;
    padding: 14px 32px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    color: #ffffff;
    background: #1c2430;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.18s ease, transform 0.18s ease;
  }

  .btn:hover,
  .btn:focus-visible {
    background: #2e3b4d;
  }

  .btn:active {
    transform: translateY(1px);
  }

  .btn:focus-visible {
    outline: 3px solid rgba(28, 36, 48, 0.25);
    outline-offset: 2px;
  }

  @media (max-width: 480px) {
    main {
      padding: 36px 22px;
    }

    h1 {
      font-size: 1.25rem;
    }

    .btn {
      display: block;
      width: 100%;
    }
  }
</style>
</head>
<body>
  <main>
    <h1>KOGEI (SMC-PRIVATE) LIMITED</h1>
    <p>Read how we collect, use, and protect your information.</p>
    <a class="btn"
       href="thirty-day-goal-privaycy-policy.html"
       target="_blank"
       rel="noopener noreferrer">Privacy Policy</a>
  </main>
</body>
</html>
